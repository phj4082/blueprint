<form class="card" id="f">

function b64(s){var b=atob(s),a=new Uint8Array(b.length);for(var i=0;i<b.length;i++)a[i]=b.charCodeAt(i);return a;}
async function unlock(pw){
  var enc=new TextEncoder();
  var km=await crypto.subtle.importKey('raw',enc.encode(pw),'PBKDF2',false,['deriveKey']);
  var key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:b64(DATA.salt),iterations:DATA.iter,hash:'SHA-256'},km,{name:'AES-GCM',length:256},false,['decrypt']);
  var pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64(DATA.iv)},key,b64(DATA.ct));
  return new TextDecoder().decode(pt);
}
document.getElementById('f').addEventListener('submit',async function(e){
  e.preventDefault();
  var btn=document.getElementById('btn'),err=document.getElementById('err');
  btn.disabled=true;err.textContent='';
  try{
    var html=await unlock(document.getElementById('pw').value);
    document.open();document.write(html);document.close();
  }catch(x){err.textContent='비밀번호가 맞지 않습니다.';btn.disabled=false;}
});
if(!window.crypto||!crypto.subtle){document.getElementById('err').textContent='이 브라우저에서는 열 수 없습니다. 최신 Chrome, Safari, Edge로 열어 주세요.';}
