<style>
body{margin:0;min-height:100vh;display:grid;place-items:center;background:#F6F7F9;color:#152238;font-family:"Pretendard Variable",Pretendard,-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif}
.card{background:#fff;border:1px solid #D8DDE5;border-radius:12px;padding:28px 26px;width:min(92vw,380px);box-sizing:border-box}

p{margin:0 0 16px;color:#4B5566;font-size:14px;line-height:1.5}

button:disabled{opacity:.6}
.err{color:#A33F16;font-size:13.5px;min-height:18px;margin:8px 0 0}
.note{font-size:12.5px;color:#7A8290;margin-top:14px;line-height:1.5}
</style>
</head>
<body>
<form class="card" id="f">
  <h1>잠긴 문서</h1>
  <p>비밀번호를 입력하면 이 기기에서만 풀립니다. 비밀번호는 어디에도 전송되지 않습니다.</p>
  <input type="password" id="pw" placeholder="비밀번호" autocomplete="current-password" autofocus>
  <button type="submit" id="btn">열기</button>
  <div class="err" id="err"></div>
  <div class="note">파일 자체가 암호화되어 있어, 주소를 알아도 비밀번호 없이는 내용을 볼 수 없습니다.</div>
</form>

function b64(s){var b=atob(s),a=new Uint8Array(b.length);for(var i=0;i<b.length;i++)a[i]=b.charCodeAt(i);return a;}
async function unlock(pw){
  var enc=new TextEncoder();
  var km=await crypto.subtle.importKey('raw',enc.encode(pw),'PBKDF2',false,['deriveKey']);
  var key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:b64(DATA.salt),iterations:DATA.iter,hash:'SHA-256'},km,{name:'AES-GCM',length:256},false,['decrypt']);
  var pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64(DATA.iv)},key,b64(DATA.ct));
  return new TextDecoder().decode(pt);
}
document.getElementById('f').addEventListener('submit',async function(e){
  e.preventDefault();
  var btn=document.getElementById('btn'),err=document.getElementById('err');
  btn.disabled=true;err.textContent='';
  try{
    var html=await unlock(document.getElementById('pw').value);
    document.open();document.write(html);document.close();
  }catch(x){err.textContent='비밀번호가 맞지 않습니다.';btn.disabled=false;}
});
if(!window.crypto||!crypto.subtle){document.getElementById('err').textContent='이 브라우저에서는 열 수 없습니다. 최신 Chrome, Safari, Edge로 열어 주세요.';}
